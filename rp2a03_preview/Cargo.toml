[package]
name = "rp2a03_preview"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rp2a03_preview"
path = "src/main.rs"

[dependencies]
rp2a03_common = { path = "../rp2a03_common" }
egui = "0.34.1"
eframe = { version = "0.34.0", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui_extras = { version = "0.34", features = ["all_loaders"] }