name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE: rp2a03_niceplug
  DIST_NAME: RP2A03_synth

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows stays on OpenGL: wgpu's DX12 backend does not currently
          # build (wgpu-hal 29.0.4 is on windows 0.62 while its own
          # gpu-allocator 0.28 is still on windows 0.61).
          - os: windows-latest
            platform: Windows
            bundle_cmd: bundle
            targets: ""
            features: ""
          # Pinned to 22.04 on purpose: it links against glibc 2.35, so the
          # bundles still load on distros older than the ubuntu-latest image.
          - os: ubuntu-22.04
            platform: Linux
            bundle_cmd: bundle
            targets: ""
            features: "--no-default-features --features wgpu"
          # bundle-universal builds both Darwin targets and lipos them into a
          # single fat binary, so one bundle covers Intel and Apple Silicon.
          # macOS deprecated OpenGL, so wgpu (Metal) is the supported path.
          - os: macos-latest
            platform: Mac
            bundle_cmd: bundle-universal
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            features: "--no-default-features --features wgpu"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI/audio dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      # Only the two backend-agnostic crates: rp2a03_niceplug's tests would drag
      # the editor's rendering backend into feature resolution for no gain, and
      # every test lives in core/common anyway.
      - name: Run tests
        run: cargo test -p rp2a03_core -p rp2a03_common --release

      - name: Bundle plugin
        run: cargo xtask ${{ matrix.bundle_cmd }} ${{ env.PACKAGE }} --release ${{ matrix.features }}

      # clap-wrapper turns the .clap we just built into an AUv3 app extension,
      # embedding the .clap inside it so the AU is self-contained. AUv3 ships as
      # a container .app (the .appex rides inside it at Contents/PlugIns/) —
      # macOS only registers the plugin once that app has been run.
      - name: Build AUv3 (Audio Unit)
        if: matrix.platform == 'Mac'
        shell: bash
        run: |
          set -euo pipefail
          # AU bundle versions must be numeric — drop any "-Alpha" style suffix.
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "AU bundle version: $version"
          # -G Xcode is mandatory, not a preference: the .appex must be linked as
          # an app-extension product and signed by Xcode, which Ninja/Makefiles
          # cannot do. CODE_SIGN_IDENTITY "-" is the ad-hoc identity, matching
          # what xtask applies to the .clap and .vst3 — an unsigned appex will
          # not load.
          cmake -B target/auv3-build -S packaging/auv3 -G Xcode \
            -DRP2A03_VERSION="$version" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="-" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=YES
          cmake --build target/auv3-build --config Release
          # The container .app is the shipped artifact. -prune keeps find from
          # descending into it and matching nested bundles.
          app=$(find target/auv3-build -name "*.app" -type d -prune | head -1)
          if [ -z "$app" ]; then
            echo "::error::AUv3 build produced no .app container"
            exit 1
          fi
          echo "AUv3 container: $app"
          # No codesign here: Xcode already signed the app and the .appex nested
          # inside it during the build. Re-signing the outer bundle after the
          # fact would invalidate the inner extension's signature.
          cp -R "$app" target/bundled/

      # clap-wrapper turns the .clap we just built into a VST3 .vst3 bundle, and
      # embeds the .clap inside it, so the VST3 is self-contained and stable.
      # This replaces niceplug's own VST3 output, which has had unresolved
      # issues on macOS.
      - name: Build VST3 (macOS via clap-wrapper)
        if: matrix.platform == 'Mac'
        shell: bash
        run: |
          set -euo pipefail
          # VST3 bundle versions must be numeric — drop any "-Alpha" style suffix.
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "VST3 bundle version: $version"
          cmake -B target/vst3-macos-build -S packaging/vst3-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRP2A03_VERSION="$version"
          cmake --build target/vst3-macos-build --config Release
          vst3=$(find target/vst3-macos-build -maxdepth 2 -name "*.vst3" -type d | head -1)
          if [ -z "$vst3" ]; then
            echo "::error::VST3 build produced no .vst3 bundle"
            exit 1
          fi
          # Drop niceplug's own VST3 output — the clap-wrapper build above
          # replaces it as the shipped macOS VST3.
          rm -rf target/bundled/*.vst3
          cp -R "$vst3" target/bundled/
          # Match the ad-hoc signing xtask applies to the .clap.
          codesign -f -s - "target/bundled/$(basename "$vst3")"

      # tar, not upload-artifact's own zipping: artifact zips drop the
      # executable bit and flatten symlinks, which breaks the macOS .vst3 /
      # .clap bundle layout and its ad-hoc code signature.
      - name: Archive bundles
        shell: bash
        run: tar -czf "bundles-${{ matrix.platform }}.tar.gz" -C target/bundled .

      - name: Upload platform bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: bundles-${{ matrix.platform }}.tar.gz
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble distributable tree
        run: |
          set -euo pipefail
          for platform in Windows Linux Mac; do
            mkdir -p "$DIST_NAME/$platform"
            tar -xzf "artifacts/bundles-$platform/bundles-$platform.tar.gz" \
              -C "$DIST_NAME/$platform"
          done
          find "$DIST_NAME" -maxdepth 3

      # -y keeps symlinks as symlinks so macOS bundles survive the round trip.
      - name: Create ${{ env.DIST_NAME }}.zip
        run: zip -r -y "$DIST_NAME.zip" "$DIST_NAME"

      - name: Upload distributable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST_NAME }}
          path: ${{ env.DIST_NAME }}.zip

      - name: Extract annotated tag message as release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # actions/checkout flattens the annotated tag into a lightweight ref
          # pointing straight at the commit, so re-fetch the real tag object
          # before reading its message.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag-body.md
          cat tag-body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST_NAME }}.zip
          body_path: tag-body.md
          generate_release_notes: true
          draft: false
