name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE: rp2a03_niceplug
  DIST_NAME: RP2A03_synth

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows stays on OpenGL: wgpu's DX12 backend does not currently
          # build (wgpu-hal 29.0.4 is on windows 0.62 while its own
          # gpu-allocator 0.28 is still on windows 0.61).
          - os: windows-latest
            platform: Windows
            bundle_cmd: bundle
            targets: ""
            features: ""
          # Pinned to 22.04 on purpose: it links against glibc 2.35, so the
          # bundles still load on distros older than the ubuntu-latest image.
          - os: ubuntu-22.04
            platform: Linux
            bundle_cmd: bundle
            targets: ""
            features: "--no-default-features --features wgpu"
          # bundle-universal builds both Darwin targets and lipos them into a
          # single fat binary, so one bundle covers Intel and Apple Silicon.
          # macOS deprecated OpenGL, so wgpu (Metal) is the supported path.
          - os: macos-latest
            platform: Mac
            bundle_cmd: bundle-universal
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            features: "--no-default-features --features wgpu"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI/audio dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      # The whole workspace, with this platform's editor backend. rp2a03_niceplug
      # owns the rendered-audio fingerprint tests and the block-size regressions,
      # so leaving it out let a DSP change ship untested.
      - name: Run tests
        run: cargo test --workspace --release ${{ matrix.features }}

      - name: Bundle plugin
        run: cargo xtask ${{ matrix.bundle_cmd }} ${{ env.PACKAGE }} --release ${{ matrix.features }}

      # clap-wrapper turns the .clap we just built into a VST3 .vst3 bundle, and
      # embeds the .clap inside it, so the VST3 is self-contained and stable.
      # This replaces niceplug's own VST3 output, which has had unresolved
      # issues on macOS.
      #
      # Ordered before the AU on purpose: this is the newer, less-proven of the
      # two clap-wrapper builds, so if it breaks we find out without the AU step
      # masking it.
      - name: Build VST3 (macOS via clap-wrapper)
        if: matrix.platform == 'Mac'
        shell: bash
        run: |
          set -euo pipefail
          # VST3 bundle versions must be numeric — drop any "-Alpha" style suffix.
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "VST3 bundle version: $version"
          cmake -B build/vst3-macos -S packaging/vst3-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DRP2A03_VERSION="$version"
          cmake --build build/vst3-macos --config Release
          vst3=$(find build/vst3-macos -maxdepth 2 -name "*.vst3" -type d | head -1)
          if [ -z "$vst3" ]; then
            echo "::error::VST3 build produced no .vst3 bundle"
            exit 1
          fi
          # Drop niceplug's own VST3 output — the clap-wrapper build above
          # replaces it as the shipped macOS VST3.
          rm -rf target/bundled/*.vst3
          cp -R "$vst3" target/bundled/
          # Match the ad-hoc signing xtask applies to the .clap.
          codesign -f -s - "target/bundled/$(basename "$vst3")"

      # clap-wrapper turns the .clap we just built into an AUv2 .component, and
      # embeds the .clap inside it, so the AU is self-contained.
      #
      # AUv2 rather than AUv3, despite Apple deprecating AUv2: clap-wrapper's
      # AUv3 container app does not compile on current Xcode. Its
      # AUv3HostAppDelegate.mm leaves the AVAuthorizationStatusNotDetermined
      # case body unbraced, so the completion block it creates is still in scope
      # at the next `default:` label — which Objective-C++ rejects outright
      # ("cannot jump from switch statement to this case label"). The .appex
      # itself builds and embeds the .clap correctly; only the container fails,
      # and a container is mandatory because macOS registers an app extension
      # solely through the app that carries it. The bug is in v0.15.1 and still
      # on upstream main, so there is no newer tag to move to. Revisit when
      # upstream fixes it; AUv2 loads in every current major DAW meanwhile.
      - name: Build AUv2 (Audio Unit)
        if: matrix.platform == 'Mac'
        shell: bash
        run: |
          set -euo pipefail
          # AU bundle versions must be numeric — drop any "-Alpha" style suffix.
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "AU bundle version: $version"
          cmake -B build/auv2 -S packaging/auv2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DRP2A03_VERSION="$version"
          cmake --build build/auv2 --config Release
          component=$(find build/auv2 -maxdepth 2 -name "*.component" -type d | head -1)
          if [ -z "$component" ]; then
            echo "::error::AUv2 build produced no .component bundle"
            exit 1
          fi
          cp -R "$component" target/bundled/
          # Match the ad-hoc signing xtask applies to the .clap and .vst3.
          codesign -f -s - "target/bundled/$(basename "$component")"

      # tar, not upload-artifact's own zipping: artifact zips drop the
      # executable bit and flatten symlinks, which breaks the macOS .vst3 /
      # .clap bundle layout and its ad-hoc code signature.
      - name: Archive bundles
        shell: bash
        run: tar -czf "bundles-${{ matrix.platform }}.tar.gz" -C target/bundled .

      - name: Upload platform bundles
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: bundles-${{ matrix.platform }}.tar.gz
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble distributable tree
        run: |
          set -euo pipefail
          for platform in Windows Linux Mac; do
            mkdir -p "$DIST_NAME/$platform"
            tar -xzf "artifacts/bundles-$platform/bundles-$platform.tar.gz" \
              -C "$DIST_NAME/$platform"
          done
          find "$DIST_NAME" -maxdepth 3

      # -y keeps symlinks as symlinks so macOS bundles survive the round trip.
      - name: Create ${{ env.DIST_NAME }}.zip
        run: zip -r -y "$DIST_NAME.zip" "$DIST_NAME"

      - name: Upload distributable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST_NAME }}
          path: ${{ env.DIST_NAME }}.zip

      - name: Extract annotated tag message as release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # actions/checkout flattens the annotated tag into a lightweight ref
          # pointing straight at the commit, so re-fetch the real tag object
          # before reading its message.
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag-body.md
          cat tag-body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DIST_NAME }}.zip
          body_path: tag-body.md
          generate_release_notes: true
          draft: false
