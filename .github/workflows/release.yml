name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/audio dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Bundle plugin
        run: cargo xtask bundle rp2a03_niceplug --release

      - name: Package release archive
        shell: bash
        run: |
          cd target/bundled
          ls -la
          7z a -tzip "../../RP2A03_Synth-${{ matrix.name }}.zip" *
          cd ../..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RP2A03_Synth-${{ matrix.name }}
          path: RP2A03_Synth-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          find artifacts -name "*.zip" -exec cp {} release-files/ \;
          ls -la release-files

      - name: Extract annotated tag message as release body
        run: |
          git tag -l --format='%(contents)' "${{ github.ref_name }}" > tag-body.md
          cat tag-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
          body_path: tag-body.md
          generate_release_notes: true
          draft: false
