name: Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: rp2a03_niceplug

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            bundle_cmd: bundle
            targets: ""
            features: ""
          - os: ubuntu-22.04
            platform: Linux
            bundle_cmd: bundle
            targets: ""
            features: "--no-default-features --features wgpu"
          - os: macos-latest
            platform: Mac
            bundle_cmd: bundle-universal
            targets: x86_64-apple-darwin,aarch64-apple-darwin
            features: "--no-default-features --features wgpu"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI/audio dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Bundle plugin
        run: cargo xtask ${{ matrix.bundle_cmd }} ${{ env.PACKAGE }} ${{ matrix.features }}

      - name: Build AUv2 (Audio Unit)
        if: matrix.platform == 'Mac'
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/[^0-9]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "AU bundle version: $version"
          cmake -B target/auv2-build -S packaging/auv2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DRP2A03_VERSION="$version"
          cmake --build target/auv2-build --config Release
          component=$(find target/auv2-build -maxdepth 2 -name "*.component" -type d | head -1)
          if [ -z "$component" ]; then
            echo "::error::AUv2 build produced no .component bundle"
            exit 1
          fi
          cp -R "$component" target/bundled/
          codesign -f -s - "target/bundled/$(basename "$component")"

      - name: Archive bundles
        shell: bash
        run: tar -czf "bundles-${{ matrix.platform }}.tar.gz" -C target/bundled .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.platform }}
          path: bundles-${{ matrix.platform }}.tar.gz
