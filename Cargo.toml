[workspace]
members = [
    "rp2a03_core",
    "rp2a03_niceplug",
    "rp2a03_common",
    "xtask",
]

# Only the plugin crates are built by default.
# The preview window must be requested explicitly:
#   cargo run -p rp2a03_preview
default-members = [
    "rp2a03_core",
    "rp2a03_niceplug",
    "rp2a03_common",
]

resolver = "2"

[workspace.package]
version = "0.0.9-Alpha"
# This project tracks current stable rather than supporting older toolchains,
# so the floor is whatever stable was when it was last raised — not the oldest
# release the code happens to compile on. Raise it freely alongside stable; the
# `msrv` CI job is what keeps this honest once stable moves past it.
rust-version = "1.97.1"

# Lints are configured once here and inherited by every member via
# `[lints] workspace = true`, so a warning cannot be enabled in one crate and
# silently missing in another.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The `cast_*` group fires on almost every register-level bit-twiddle and DSP
# sample conversion in this codebase (~240 instances, none of them bugs —
# ranges are already constrained by masks/clamps before the cast). Blanket
# noise with no signal for this domain; allowed rather than scattering
# hundreds of individual #[allow]s.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
# Established project convention (see e.g. `Envelope::clock`'s local
# constants): a const declared right where it's used reads better than one
# hoisted to the top of the function or file.
items_after_statements = "allow"
# Short domain pairs (param1/param2, bar_y_min/bar_y_max, lo/hi) trip this on
# names that are already unambiguous in context; genuinely confusing pairs
# (a `path` that could be misread as the `patch` next to it) are renamed
# instead of relying on this lint.
similar_names = "allow"

# Selected `clippy::nursery` lints, not the whole group: `missing_const_for_fn`
# (90 hits) and `suboptimal_flops`/`imprecise_flops` (43 hits, changes FMA
# rounding) would touch huge swaths of the crate for marginal benefit, and the
# float-rounding one risks silently shifting the M0 baseline hashes — exactly
# the kind of change that baseline exists to catch, not something to opt into
# via a nursery lint. `too_long_first_doc_paragraph` is a pure style
# preference not worth fighting the doc comments just written for step 41.
use_self = "warn"
redundant_pub_crate = "warn"
or_fun_call = "warn"
option_if_let_else = "warn"
derive_partial_eq_without_eq = "warn"
while_float = "warn"
needless_pass_by_ref_mut = "warn"
doc_link_code = "warn"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "warn"

# The audio path is a per-sample inner loop; the defaults (no LTO,
# codegen-units = 16) leave real headroom on the table. `panic` is deliberately
# left at the default `unwind`: this crate ships as a cdylib inside a host
# process, so `abort` would take the whole DAW down with it.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[workspace.dependencies]
egui = "0.34.1"
egui_extras = { version = "0.34", features = ["image"] }
image = { version = "0.25", features = ["png"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
nice-plug = "0.1.10"
nice-plug-egui = {
    version = "0.1.5",
    default-features = false,
}
parking_lot = "0.12"
rfd = "0.15"
ctor = "1.0.12"
dirs = "6.0.0"
assert_no_alloc = { version = "1.1", features = ["disable_release"] }
triple_buffer = "9.0"
basedrop = "0.1.3"
criterion = { version = "0.8", features = ["html_reports"] }
rp2a03_core = { path = "rp2a03_core" }
rp2a03_common = { path = "rp2a03_common" }
