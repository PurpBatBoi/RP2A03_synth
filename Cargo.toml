[workspace]
members = [
    "rp2a03_core",
    "rp2a03_niceplug",
    "rp2a03_common",
    "xtask",
]

# Only the plugin crates are built by default.
# The preview window must be requested explicitly:
#   cargo run -p rp2a03_preview
default-members = [
    "rp2a03_core",
    "rp2a03_niceplug",
    "rp2a03_common",
]

resolver = "2"

[workspace.dependencies]
egui = "0.34.1"
egui_extras = { version = "0.34", features = ["image"] }
image = { version = "0.25", features = ["png"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nice-plug = "0.1.10"
nice-plug-egui = "0.1.5"
parking_lot = "0.12"
rp2a03_core = { path = "rp2a03_core" }
rp2a03_common = { path = "rp2a03_common" }
